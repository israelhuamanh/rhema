[package]
name = "rhema-ui"
version = "0.1.0"
description = "Rhema - Proyector Bíblico Automatizado"
authors = ["Rhema Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
